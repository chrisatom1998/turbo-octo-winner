    <!-- Sparkle dots -->
    <circle cx="-4.8" cy="-4" r="1" fill="white" opacity="0.8"/>
    <circle cx="4.8" cy="-4" r="1" fill="white" opacity="0.8"/>
    <circle cx="-4.8" cy="4" r="1" fill="white" opacity="0.8"/>
    <circle cx="4.8" cy="4" r="1" fill="white" opacity="0.8"/>
