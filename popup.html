<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Release Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>
        <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#4285F4"/>
          <path d="M2 17L12 22L22 17L12 12L2 17Z" fill="#34A853"/>
          <path d="M2 12L12 17L22 12" stroke="#FBBC04" stroke-width="2"/>
        </svg>
        Gemini Release Tracker
      </h1>
    </header>

    <div class="refresh-container">
      <button id="refreshBtn" class="refresh-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
        Refresh
      </button>
      <span id="lastUpdated" class="last-updated"></span>
    </div>

    <div class="filter-container">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">
          All Models
        </button>
        <button class="filter-tab" data-filter="experimental">
          <span class="experimental-icon">🧪</span> Experimental
          <span id="experimentalCount" class="count-badge">0</span>
        </button>
        <button class="filter-tab" data-filter="available">Available</button>
        <button class="filter-tab" data-filter="upcoming">Upcoming</button>
      </div>
      <label class="notification-toggle">
        <input type="checkbox" id="notifyExperimental">
        <span>Notify on new experimental models</span>
      </label>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading Gemini releases...</p>
    </div>

    <div id="error" class="error" style="display: none;">
      <p id="errorMessage"></p>
      <button id="retryBtn" class="retry-btn">Retry</button>
    </div>

    <div id="releases" class="releases"></div>

    <footer>
      <a href="https://ai.google.dev/gemini-api/docs" target="_blank" class="footer-link">
        View Official Docs
      </a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
